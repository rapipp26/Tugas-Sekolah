<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pendaftaran Ekskul</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Card Form -->
      <div class="card">
        <div class="card-header">
          <h1>Form Pendaftaran Ekskul</h1>
          <h1>SMK Letris Pamulang</h1>
        </div>

        <form id="formPendaftaran">
          <div class="form-group">
            <label for="nama">Nama Lengkap:</label>
            <input
              type="text"
              name="nama"
              id="nama"
              placeholder="Masukkan nama siswa"
              required
            />
          </div>

          <div class="form-group">
            <label>Kelas:</label>
            <div class="radio-group">
              <label><input type="radio" name="kelas" value="X" required /> X</label>
              <label><input type="radio" name="kelas" value="XI" /> XI</label>
              <label><input type="radio" name="kelas" value="XII" /> XII</label>
            </div>
          </div>

          <div class="form-group">
            <label for="jurusan">Jurusan:</label>
            <select name="jurusan" id="jurusan" required>
              <option value="">-- Pilih Jurusan --</option>
              <option value="PPLG">PPLG</option>
              <option value="TJKT">TJKT</option>
              <option value="DKV">DKV</option>
              <option value="AKL">AKL</option>
              <option value="BDP">BDP</option>
            </select>
          </div>

          <div class="form-group">
            <label for="ekskul">Pilihan Ekskul:</label>
            <select name="ekskul" id="ekskul" required>
              <option value="">-- Pilih Ekstrakurikuler --</option>
              <option value="Futsal">Futsal</option>
              <option value="Basket">Basket</option>
              <option value="Voli">Voli</option>
              <option value="Pramuka">Pramuka</option>
              <option value="Paskibra">Paskibra</option>
            </select>
          </div>

          <div class="button-group">
            <button type="submit" id="submit">Tambah Data</button>
            <button type="button" id="btnBatal" style="display: none;">Batal Edit</button>
          </div>
        </form>
      </div>

      <!-- Card Data Tabel -->
      <div class="card">
        <h2 class="table-title">Data Pendaftaran Siswa</h2>
        <div class="table-responsive">
          <table id="tabel">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Jurusan</th>
                <th>Ekskul</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      let dataSiswa = [];
      let editIndex = -1;

      const form = document.getElementById("formPendaftaran");
      const inputNama = document.getElementById("nama");
      const selectJurusan = document.getElementById("jurusan");
      const selectEkskul = document.getElementById("ekskul");
      const btnSubmit = document.getElementById("submit");
      const btnBatal = document.getElementById("btnBatal");
      const tabelBody = document.getElementById("tabelBody");

      function renderTabel() {
        tabelBody.innerHTML = "";

        dataSiswa.forEach((siswa, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${siswa.nama}</td>
            <td>${siswa.kelas}</td>
            <td>${siswa.jurusan}</td>
            <td>${siswa.ekskul}</td>
            <td>
              <button type="button" class="btn-action btn-edit" onclick="mulaiEdit(${index})">Edit</button>
              <button type="button" class="btn-action btn-delete" onclick="hapusData(${index})">Delete</button>
            </td>
          `;
          tabelBody.appendChild(tr);
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const nama = inputNama.value.trim();
        const kelasChecked = document.querySelector('input[name="kelas"]:checked');
        const jurusan = selectJurusan.value;
        const ekskul = selectEkskul.value;

        if (!nama || !kelasChecked || !jurusan || !ekskul) {
          alert("Harap lengkapi semua kolom form!");
          return;
        }

        const kelas = kelasChecked.value;

        if (editIndex === -1) {
          dataSiswa.push({ nama, kelas, jurusan, ekskul });
          alert("Data berhasil ditambahkan!");
        } else {
          dataSiswa[editIndex] = { nama, kelas, jurusan, ekskul };
          editIndex = -1;
          btnSubmit.textContent = "Tambah Data";
          btnSubmit.classList.remove("btn-update");
          btnBatal.style.display = "none";
          alert("Data berhasil diperbarui!");
        }

        form.reset();
        renderTabel();
      });

      function mulaiEdit(index) {
        editIndex = index;
        const siswa = dataSiswa[index];

        inputNama.value = siswa.nama;

        const radioKelas = document.querySelector(`input[name="kelas"][value="${siswa.kelas}"]`);
        if (radioKelas) {
          radioKelas.checked = true;
        }

        selectJurusan.value = siswa.jurusan;
        selectEkskul.value = siswa.ekskul;

        btnSubmit.textContent = "Simpan Perubahan";
        btnSubmit.classList.add("btn-update");
        btnBatal.style.display = "inline-block";

        inputNama.focus();
      }

      btnBatal.addEventListener("click", function () {
        editIndex = -1;
        form.reset();
        btnSubmit.textContent = "Tambah Data";
        btnSubmit.classList.remove("btn-update");
        btnBatal.style.display = "none";
      });

      function hapusData(index) {
        const konfirmasi = confirm(`Apakah Anda yakin ingin menghapus data "${dataSiswa[index].nama}"?`);
        if (konfirmasi) {
          if (editIndex === index) {
            btnBatal.click();
          } else if (editIndex > index) {
            editIndex--;
          }

          dataSiswa.splice(index, 1);
          renderTabel();
          alert("Data berhasil dihapus!");
        }
      }
    </script>
  </body>
</html>
</html>
